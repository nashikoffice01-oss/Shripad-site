<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#152238;
    --ink-2:#25395c;
    --paper:#F7F6F2;
    --paper-2:#EFEDE6;
    --line:#D8D4C8;
    --amber:#C97A2B;
    --amber-2:#E4913F;
    --green:#3D7A4E;
    --red:#B3452C;
    --white:#FFFFFF;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --disp: 'Space Grotesk', 'Inter', sans-serif;
    --body: 'Inter', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  *{box-sizing:border-box;}
  #ra-root{
    font-family:var(--body);
    color:var(--ink);
    background:var(--paper);
    height:100vh;
    min-height:600px;
    max-height:100vh;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    font-size:13px;
    line-height:1.45;
  }
  #ra-root ::selection{background:var(--amber-2);color:#fff;}

  /* ---------- Sidebar ---------- */
  .ra-side{
    width:190px;
    flex:none;
    background:var(--ink);
    color:#DCE3EF;
    display:flex;
    flex-direction:column;
    padding:18px 0;
  }
  .ra-brand{
    font-family:var(--disp);
    font-weight:700;
    font-size:15px;
    color:#fff;
    padding:0 18px 16px 18px;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:10px;
    letter-spacing:.2px;
  }
  .ra-brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;color:#9DAFC9;letter-spacing:.08em;margin-top:3px;text-transform:uppercase;}
  .ra-nav-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 18px;
    cursor:pointer;
    font-size:12.5px;
    color:#B7C3D9;
    border-left:3px solid transparent;
    transition:.12s;
    font-weight:500;
  }
  .ra-nav-item .n{font-family:var(--mono);font-size:10.5px;color:#6C7FA0;width:16px;flex:none;}
  .ra-nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .ra-nav-item.active{background:rgba(228,145,63,.13);color:#fff;border-left-color:var(--amber-2);}
  .ra-nav-item.active .n{color:var(--amber-2);}
  .ra-side-foot{
    margin-top:auto;
    padding:12px 18px 0 18px;
    border-top:1px solid rgba(255,255,255,.1);
    font-size:10.5px;
    color:#7688A6;
    font-family:var(--mono);
  }

  /* ---------- Main ---------- */
  .ra-main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .ra-topbar{
    padding:12px 22px;
    background:var(--white);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap;
  }
  .ra-proj-select{display:flex;align-items:center;gap:8px;}
  .ra-proj-select select{
    font-family:var(--body); font-weight:600; font-size:13px;
    padding:6px 10px; border:1px solid var(--line); border-radius:4px; background:var(--paper);
    color:var(--ink); max-width:320px;
  }
  .ra-topbar-stats{display:flex;gap:18px;}
  .ra-stat{text-align:right;}
  .ra-stat .v{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--ink);}
  .ra-stat .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8A8676;}

  .ra-body{flex:1; overflow:auto; padding:20px 22px 40px 22px;}

  h2.ra-h{font-family:var(--disp);font-size:17px;font-weight:600;margin:0 0 3px 0;color:var(--ink);}
  p.ra-sub{margin:0 0 16px 0;color:#726F62;font-size:12px;}

  .ra-btn{
    font-family:var(--body); font-weight:600; font-size:12px;
    padding:7px 13px; border-radius:4px; border:1px solid var(--ink);
    background:var(--ink); color:#fff; cursor:pointer; white-space:nowrap;
  }
  .ra-btn:hover{background:var(--ink-2);}
  .ra-btn.amber{background:var(--amber); border-color:var(--amber);}
  .ra-btn.amber:hover{background:var(--amber-2);}
  .ra-btn.ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .ra-btn.ghost:hover{border-color:var(--ink);}
  .ra-btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
  .ra-btn.danger:hover{background:var(--red);color:#fff;}
  .ra-btn.sm{padding:4px 9px;font-size:11px;}
  .ra-btn:disabled{opacity:.4;cursor:not-allowed;}

  .ra-card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;}

  input.ra-in, select.ra-in, textarea.ra-in{
    font-family:var(--body); font-size:12.5px; padding:6px 9px;
    border:1px solid var(--line); border-radius:4px; background:var(--white); color:var(--ink); width:100%;
  }
  input.ra-in:focus, select.ra-in:focus, textarea.ra-in:focus{outline:2px solid var(--amber-2); outline-offset:0; border-color:var(--amber-2);}
  input.ra-in.sm{padding:4px 6px; font-size:12.5px;}
  .ra-num{font-family:var(--mono); text-align:right;}
  /* Narrow columns (Qty, Rate in the Mini RA build-up table) were showing almost no visible
     digits — the browser's native number-input spin arrows were eating most of the available
     width in a ~70px cell. Removing them gives the actual number the full width to display in. */
  input.ra-in[type="number"]::-webkit-outer-spin-button,
  input.ra-in[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input.ra-in[type="number"]{ -moz-appearance:textfield; }
  label.ra-lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8A8676;margin-bottom:4px;font-weight:600;}
  .ra-field{margin-bottom:10px;}
  .ra-row{display:flex;gap:10px;}
  .ra-row > *{flex:1;min-width:0;}

  table.ra-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.ra-tbl th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:#8A8676; padding:7px 9px; border-bottom:2px solid var(--ink); font-weight:600; white-space:nowrap;
    position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .ra-card table.ra-tbl th{background:var(--white);}
  table.ra-tbl td{padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.ra-tbl tbody tr:hover{background:var(--paper-2);}
  table.ra-tbl td.num, table.ra-tbl th.num{font-family:var(--mono); text-align:right;}
  table.ra-tbl tr.clickable{cursor:pointer;}
  .ra-desc-cell{max-width:360px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .ra-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;}
  .ra-tag.Material{background:#E4EEE1;color:#3D7A4E;}
  .ra-tag.Labour{background:#FBEADC;color:#B3652E;}
  .ra-tag.Machinery{background:#E2E9F5;color:#2B4E8C;}
  .ra-tag.Fuel{background:#F5E2E2;color:#A03B3B;}
  .ra-tag.Subcontract{background:#EFE4F3;color:#7A3D8C;}

  .ra-empty{text-align:center;padding:50px 20px;color:#9C9887;}
  .ra-empty .big{font-family:var(--disp);font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600;}

  .ra-drop{
    border:2px dashed var(--line); border-radius:6px; padding:30px 20px; text-align:center; cursor:pointer;
    background:var(--paper-2); transition:.12s;
  }
  .ra-drop:hover{border-color:var(--amber-2); background:#FBF3E9;}
  .ra-drop .ic{font-size:26px;margin-bottom:8px;}

  .ra-modal-bg{position:fixed;inset:0;background:rgba(21,34,56,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .ra-modal{background:#fff;border-radius:8px;padding:20px;width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .ra-modal h3{font-family:var(--disp);margin:0 0 14px 0;font-size:15px;}

  .ra-close{position:absolute;top:14px;right:16px;cursor:pointer;color:#8A8676;font-size:16px;}

  .ra-bar-wrap{width:100%;height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;}
  .ra-bar-fill{height:100%;border-radius:3px;}

  .ra-badge{font-family:var(--mono);font-weight:600;font-size:11px;padding:2px 6px;border-radius:3px;}
  .ra-badge.pos{background:#E4EEE1;color:var(--green);}
  .ra-badge.neg{background:#F5E2E2;color:var(--red);}
  .ra-badge.zero{background:var(--paper-2);color:#8A8676;}

  .ra-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .ra-search{max-width:260px;}

  .ra-hist-item{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-bottom:1px solid var(--paper-2);font-size:12px;cursor:pointer;}
  .ra-hist-item:hover{background:var(--paper-2);}
  .ra-hist-item .rt{font-family:var(--mono);font-weight:600;}
  .ra-hist-item .dt{color:#9C9887;font-size:10.5px;}

  .ra-toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:5px;font-size:12px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);}

  .ra-linegrid{display:grid;grid-template-columns:90px 1.2fr 85px 75px 75px 75px 90px 90px 1fr 34px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--paper-2);}
  .ra-linegrid.head{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#8A8676;font-weight:600;border-bottom:2px solid var(--ink);padding-bottom:8px;}
  .ra-linegrid input, .ra-linegrid select{font-size:11.5px;padding:5px 6px;}

  /* Elements that belong to paid editions are hidden while the page root carries "ra-free". */
  .ra-free .ra-pro-only{display:none !important;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#C8C3B4;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<div id="ra-root"></div>
